<!DOCTYPE html>
<html>

<head>
    <title>Building Energy-Performance Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background: #f4f4f9;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background: #007BFF;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e2f0d9;
            border: 1px solid #c8e1b9;
            border-radius: 4px;
            color: #274e13;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Energy Model Prediction</h2>

        <!-- The form submits data via POST to FastAPI -->
        <form method="POST">
            <div class="form-group">
                <label>Space Floor Area (m²):</label>
                <input type="number" step="any" name="Area" value="{{ Area or '' }}" required>
            </div>

            <div class="form-group">
                <label>Space Height (meters):</label>
                <input type="number" step="any" name="Height" value="{{ Height or '' }}" required>
            </div>

            <div class="form-group">
                <label>Thermal Conductivity (W/m-K):</label>
                <select name="Conductivity">
                    <option value="0.04" {% if Conductivity==0.04 %}selected{% endif %}>Low Insulation (0.04)</option>
                    <option value="0.30" {% if Conductivity==0.30 %}selected{% endif %}>Medium Brick (0.30)</option>
                    <option value="1.40" {% if Conductivity==1.40 %}selected{% endif %}>High Concrete (1.40)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Material Thickness (meters):</label>
                <select name="Thickness">
                    <option value="0.05" {% if Thickness==0.05 %}selected{% endif %}>5 cm (0.05m)</option>
                    <option value="0.10" {% if Thickness==0.10 %}selected{% endif %}>10 cm (0.10m)</option>
                    <option value="0.20" {% if Thickness==0.20 %}selected{% endif %}>20 cm (0.20m)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Weather Profile:</label>
                <select name="Weather">
                    <option value="Chicago" {%if Weather=='Chicago' %}selected{% endif %}>
                        Chicago-OHare
                    </option>
                    <option value="Madrid" {%if Weather=='Madrid' %}selected{% endif %}>
                        Madrid-Barajas
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Target Parameter to Predict:</label>
                <select name="Target_variable">
                    <option value="Variable_Cooling Zone Relative Humidity [%]" {% if
                        Target=='Variable_Cooling Zone Relative Humidity [%]' %}selected{% endif %}>
                        Variable_Cooling Zone Relative Humidity [%]
                    </option>
                    <option value="Variable_Cooling Zone Temperature [C]" {% if
                        Target=='Variable_Cooling Zone Temperature [C]' %}selected{% endif %}>
                        Variable_Cooling Zone Temperature [C]
                    </option>
                    <option value="Variable_Des Cool Mass Flow [kg/s]" {% if
                        Target=='Variable_Des Cool Mass Flow [kg/s]' %}selected{% endif %}>
                        Variable_Des Cool Mass Flow [kg/s]
                    </option>
                    <option value="Variable_Des Heat Mass Flow [kg/s]" {% if
                        Target=='Variable_Des Heat Mass Flow [kg/s]' %}selected{% endif %}>
                        Variable_Des Heat Mass Flow [kg/s]
                    </option>
                    <option value="Variable_Des Heat Load [W]" {% if Target=='Variable_Des Heat Load [W]'
                        %}selected{%endif %}>
                        Variable_Des Heat Load [W]
                    </option>
                    <option value="Variable_Des Sens Cool Load [W]" {% if Target=='Variable_Des Sens Cool Load [W]'
                        %}selected{% endif %}>
                        Variable_Des Sens Cool Load [W]
                    </option>
                    <option value="Variable_Heating Zone Relative Humidity [%]" {% if
                        Target=='Variable_Heating Zone Relative Humidity [%]' %}selected{% endif %}>
                        Variable_Heating Zone Relative Humidity [%]
                    </option>
                    <option value="Variable_Heating Zone Temperature [C]" {% if
                        Target=='Variable_Heating Zone Temperature [C]' %}selected{% endif %}>
                        Variable_Heating Zone Temperature [C]
                    </option>
                </select>
            </div>

            <button type="submit">Calculate Prediction</button>
        </form>

        <!-- If Python sent a prediction back, display it here -->
        {% if Prediction is not none %}
        <div class="result">
            <h3>Prediction Result:</h3>
            <p>Estimated Value: <strong>{{ Prediction }}</strong></p>
        </div>
        {% endif %}
    </div>
</body>

</html>
