# version: '3.8'

services:
  # BACKEND SERVICES
  core-service:
    build: ./service_core
    ports:
      - "2001:8001" # host_port(laptop):container_port
    depends_on:
      - postgres-db
    env_file:
      - .env
    volumes:
      - ./common_storage:/app/storage # host_storage(laptop);container_storage

  runner-service:
    build: ./service_runner
    ports:
      - "2002:8002" # localhost=2002 (between containers 8002)
    env_file:
      - .env
    environment:
      - CORE_SERVICE_PATH=http://core-service:8001
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:/app/storage

  postprocess-service:
    build: ./service_postprocess
    ports:
      - "2003:8003" # localhost=2003 (between containers 8003)
    env_file:
      - .env
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:/app/storage

  ml-service:
    build: ./neuronal_network
    ports:
      - "2004:8004"
    env_file:
      - .env
    depends_on:
      - postprocess-service
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:/app/storage

  # FRONT END SERVICE
  ui-service:
    build: ./service_ui
    ports:
      - "2005:8501" # localhost=2005 (between containers 8501 is Streamlit)
    environment:
      - CORE_URL=http://core-service:8001
      - RUNNER_URL=http://runner-service:8002

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "2006:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

# relational data volume
volumes:
  postgres_data:
  common_storage:
