version: '3.8'

services:
  # BACKEND SERVICES
  core-service:
    build: ./servise_core
    ports: -"2001:8001" # host_port(laptop):container_port
    env_file:
      - .env
    # Volume for commoon files
    volumes:
      - ./common_storage:/app/storage # host_storage(laptop);container_storage

  runner-service:
    build: ./service_runner
    ports:
      - "2002:8002" # localhost=2002 (between containers 8002)
    env_file:
      - .env
    environment:
      - CORE_SERVICE_PATH=http://core-service:8001
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:/app/storage

  postprocess_service:
    build: ./service_postprocess
    ports:
      - "2003:8003" # localhost=2003 (between containers 8003)
    env_file:
      - .env
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:/app/storage

  ml-service:
    build: ./neuronal_network
    ports:
      - "2004:8004"
    depends_on:
      - postprocess-service
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:./app/storage

  # FRONT END SERVICE
  ui-service:
    build: ./service_ui
    ports:
      - "2005:8501" #  # localhost=2005 (between containers 8501 is Streamlit)
    environment:
      - CORE_URL=http://core-service:8001
      - RUNNER_URL=http://runner-service:8002

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${DATABASE_USER} # stored in .env
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "2006:5432" # localhost=2003 (between containers 5432)
    volumes:
      # laptop_name:container_name
      - postgres_data:/var/lib/postgresql/data
      # initializing the database in the container (calling .d)
      - ./db_init:/docker-entrypoint-initdb.d

  # relational data volume
  volumes:
    postgres_data:
