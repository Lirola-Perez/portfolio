#version: '3.8'

services:
  # BACKEND SERVICES
  core-service:
    build: ./service_core
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./common_storage:/app/storage # host_storage(laptop);container_storage

  runner-service:
    build: ./service_runner
    env_file:
      - .env
    environment:
      - CORE_SERVICE_PATH=http://core-service:8001
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:/app/storage

  postprocess-service:
    build: ./service_postprocess
    env_file:
      - .env
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:/app/storage

  ml-service:
    build: ./neuronal_network
    env_file:
      - .env
    depends_on:
      - postprocess-service
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:/app/storage

  # FRONT END SERVICE
  ui-service:
    build: ./service_ui
    env_file:
      - .env
    ports:
      - "2001:8000" # localhost=2001 
    environment:
      - CORE_URL=http://core-service:8001
      - RUNNER_URL=http://runner-service:8002
      - POST_PROCESS_URL=http://postprocess-service:8003
    volumes:
      - ./common_storage:/app/storage

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

# relational data volume
volumes:
  postgres_data:
  common_storage:
