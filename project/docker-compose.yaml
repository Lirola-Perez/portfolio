#version: '3.8'

services:
  # BACKEND SERVICES
  core-service:
    build: ./service_core
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - .env # Points the main folder
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./common_storage:/app/storage # host_storage(laptop);container_storage

  runner-service:
    build: ./service_runner
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - .env # Points the main folder
    environment:
      - CORE_SERVICE_PATH=http://core-service:8001
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:/app/storage

  postprocess-service:
    build: ./service_postprocess
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - .env # Points the main folder
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:/app/storage

  ml-service:
    build: ./neuronal_network
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env # Points the main folder
    # Mounting volume for commoon files
    volumes:
      - ./common_storage:/app/storage

  # FRONT END SERVICE
  ui-service:
    build: ./service_ui
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - .env # Points the main folder
    ports:
      - "2001:8000" # localhost=2001 
    environment:
      - CORE_URL=http://core-service:8001
      - RUNNER_URL=http://runner-service:8002
      - POST_PROCESS_URL=http://postprocess-service:8003
      - PYTHONUNBUFFERED=1
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./common_storage:/app/storage

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_db
    env_file:
      - .env # Points the main folder
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

# relational data volume
volumes:
  postgres_data:
  common_storage:
