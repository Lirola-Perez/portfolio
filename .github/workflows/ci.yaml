name: CI pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # resolves username/repos

# STEP 1: standard pushes and checkings
jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/project/service_ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python env
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip list
          python -m pip install --upgrade pip
          python -m pip install -vr project/service_ui/requirements.txt
          pip install -v pytest httpx ruff

      - name: Run Code Linter (Ruff)
        run: |
          python -m ruff check project/ --fix --show-fixes

      - name: Run test suite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd project
          pytest tests/ -v

  # Creating artifacts (images) for later cloud use
  build-and-push:
    needs: test
    if: github.event_name == 'push' # && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Define your 5 microservices here as a matrix
    strategy:
      matrix:
        service:
          - name: service_runner
            path: project/service_runner/
          - name: service_ui
            path: project/service_ui/
          - name: service_core
            path: project/service_core/
          - name: service_postprocess
            path: project/service_postprocess/
          - name: neuronal_network
            path: project/neuronal_network/

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service.name }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }} # <- Here points as the ORIGIN (each services as in the docker-compose.yml)
          file: ${{ matrix.service.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
