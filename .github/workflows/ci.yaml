name: CI pipeline

on:
  push:
    branches: [ sql_based ]
  pull_request:
    branches: [ sql based ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/project/service_ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python env
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip list
          python -m pip install --upgrade pip
          python -m pip install -vr project/service_ui/requirements.txt
          pip install -v pytest httpx ruff

      - name: Run Code Linter (Ruff)
        run: |
          python -m ruff check project/ --fix --show-fixes

      - name: Run test suite
        run: |
          cd project
          pytest tests/ -v
